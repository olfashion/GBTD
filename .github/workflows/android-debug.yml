name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 \
            "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/editor.zip"
          curl --fail --location --retry 3 \
            "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot"
          unzip -j -q "$RUNNER_TEMP/godot/templates.tpz" \
            templates/android_debug.apk templates/android_release.apk templates/version.txt \
            -d "$template_dir"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          printf 'GODOT=%s\n' "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Configure Android SDK and development signing
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/good-boys-debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          settings = Path.home() / ".config/godot/editor_settings-4.7.tres"
          settings.parent.mkdir(parents=True, exist_ok=True)
          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": os.environ["RUNNER_TEMP"] + "/good-boys-debug.keystore",
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          settings.write_text(
              '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
              + "".join(f"{key} = {json.dumps(value)}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
      - name: Validate game and export development APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --editor --import --quit
          for test_file in tests/test_*.gd; do
            "$GODOT" --headless --path . --script "$test_file"
          done
          mkdir -p builds/android
          "$GODOT" --headless --path . --export-debug "Android" builds/android/good-boys.apk
          test -s builds/android/good-boys.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify builds/android/good-boys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: good-boys-android-debug
          path: builds/android/good-boys.apk
          if-no-files-found: error
          retention-days: 14
